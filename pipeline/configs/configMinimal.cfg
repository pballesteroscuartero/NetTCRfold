##Minimal config.cfg — only the fields required to run the pipeline end to end.
RUN_JSON_WITH_MSA_TEMPLATE_GENERATION=true
RUN_DATA_GENERATION_PIPELINE=true
RUN_CUSTOM_JSON_GENERATION=true
RUN_AF3_INFERENCE=true
COMPUTE_DOCKQ=false
RUN_METRICS_COLLECTION=true

##Set input data directory and file
DATA_DIR="examples/data_minimal/" #Holds both the input csv and all pipeline outputs for this run. Relative to pipeline/, where workflow.sh is run from.
INPUT_FILE="single_target.csv"

##DockQ computation: required only if you set COMPUTE_DOCKQ=true above.
#TEMPLATE_PATH="/path/to/solved_structures/"
